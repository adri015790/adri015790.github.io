<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Suche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#3c382f;
    --panel:#3B3C36;
    --panel-soft:#46463f;
    --ink:#EDE6D4;
    --ink-dim:#a99f8c;
    --accent:#cf9b3e;
    --danger:#c0725a;
    --results-width: 380px; /* wird per JS aus RESULTS_WIDTH_PX gesetzt */
    --radius-soft: 14px;
  }
.playfair-display-<uniquifier> {
  font-family: "Playfair Display", serif;
  font-optical-sizing: auto;
  font-weight: 600;
  font-style: normal;
}


  /* ---------- Login-Overlay ---------- */
  #login-overlay{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg);
    z-index:50;
  }
  #login-overlay.hidden{display:none;}
  #login-btn{
    font-family:inherit;
    font-size:1rem;
    font-weight:600;
    background:var(--panel);
    color:var(--ink);
    border:1px solid #55554c;
    padding:14px 26px;
    border-radius:999px;
    cursor:pointer;
    letter-spacing:.01em;
  }
  #login-btn:hover{background:var(--panel-soft);}
  #login-hint{
    position:absolute;
    bottom:14%;
    color:var(--ink-dim);
    font-size:.85rem;
    max-width:320px;
    text-align:center;
  }

  /* ---------- Hauptbereich ---------- */
  #app{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
    padding:24px;
    opacity:0;
    transition:opacity .5s ease;
  }
  #app.ready{opacity:1;}

  #phrase{
    font-size:1.05rem;
    font-weight:500;
    color:var(--ink-dim);
    margin-bottom:22px;
    min-height:1.4em;
    text-align:center;
  }

  .search-col{
    width:var(--results-width);
    max-width:92vw;
  }

  #search-input{
    width:100%;
    font-family:inherit;
    font-size:1.15rem;
    font-weight:500;
    color:var(--ink);
    background:var(--panel);
    border:1px solid #4c4c44;
    border-radius:var(--radius-soft);
    padding:16px 18px;
    outline:none;
  }
  #search-input::placeholder{color:var(--ink-dim);}
  #search-input:focus{border-color:var(--accent);}

  #results-list{
    list-style:none;
    margin:10px 0 0;
    padding:0;
    width:100%;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .result-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:9px 12px;
    border-radius:10px;
    cursor:pointer;
  }
  .result-item img{
    width:42px; height:42px;
    border-radius:8%;
    object-fit:cover;
    flex-shrink:0;
    background:var(--panel-soft);
  }
  .result-text{min-width:0;}
  .result-title{
    font-size:.95rem;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .result-artist{
    font-size:.8rem;
    color:var(--ink-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .result-item.active{background:var(--panel);}
  .result-item.active .result-title{color:var(--accent);}

  /* ---------- Einstellungen ---------- */
  #settings-btn{
    position:fixed;
    top:16px; right:16px;
    width:22px; height:22px;
    border:none;
    background:transparent;
    color:var(--panel-soft);
    opacity:.55;
    cursor:pointer;
    padding:0;
    z-index:40;
    transition:opacity .15s ease, color .15s ease;
  }
  #settings-btn:hover{opacity:1; color:var(--ink-dim);}
  #settings-btn svg{width:100%; height:100%;}

  #settings-panel{
    position:fixed;
    top:46px; right:16px;
    width:260px;
    background:var(--panel);
    border:1px solid #4c4c44;
    border-radius:var(--radius-soft);
    padding:16px;
    z-index:41;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  #settings-panel.hidden{display:none;}
  #settings-panel h2{
    font-size:.8rem;
    font-weight:700;
    margin:0 0 12px;
    color:var(--ink-dim);
  }
  .settings-row{
    margin-bottom:14px;
  }
  .settings-row:last-child{margin-bottom:0;}
  .settings-label{
    display:block;
    font-size:.78rem;
    color:var(--ink-dim);
    margin-bottom:5px;
  }
  .settings-row select,
  .settings-row input[type=range],
  .settings-row input[type=number]{
    width:100%;
    font-family:inherit;
    background:var(--panel-soft);
    color:var(--ink);
    border:1px solid #55554c;
    border-radius:8px;
    padding:6px 8px;
    font-size:.85rem;
  }
  #account-name{font-size:.88rem; font-weight:600; margin:0 0 8px;}
  .settings-btn-row{
    width:100%;
    font-family:inherit;
    font-size:.82rem;
    font-weight:600;
    background:transparent;
    color:var(--danger);
    border:1px solid var(--danger);
    border-radius:8px;
    padding:7px 0;
    cursor:pointer;
  }
  .settings-btn-row:hover{background:rgba(192,114,90,.12);}

  /* ---------- Geräteauswahl ---------- */
  #device-picker{
    position:fixed;
    bottom:118px;
    left:50%;
    transform:translateX(-50%);
    width:320px;
    background:var(--panel);
    border:1px solid #4c4c44;
    border-radius:6px; /* ~8% der Boxhöhe, wie beim Player-Popup */
    padding:10px;
    z-index:35;
    transition:opacity 1s ease;
  }
  #device-picker.hidden{display:none;}
  #device-picker.fading{opacity:0;}
  .device-picker-title{
    font-size:.72rem;
    color:var(--ink-dim);
    margin:2px 6px 8px;
  }
  .device-option{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 10px;
    border-radius:8px;
    cursor:pointer;
    font-size:.85rem;
  }
  .device-option:hover{background:var(--panel-soft);}

  /* ---------- Now Playing ---------- */
  #now-playing{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    width:400px;
    max-width:92vw;
    background:var(--panel);
    border:1px solid #4c4c44;
    border-radius:6px; /* ~8% der Boxhöhe -> leicht gebogen, nicht rund */
    padding:12px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    z-index:30;
  }
  #now-playing.hidden{display:none;}
  #np-cover{
    width:48px; height:48px;
    border-radius:8%;
    object-fit:cover;
    flex-shrink:0;
    background:var(--panel-soft);
  }
  #np-info{min-width:0; flex:1;}
  #np-title{
    font-size:.92rem;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  #np-artist{
    font-size:.78rem;
    color:var(--ink-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  #np-time{
    font-size:.74rem;
    color:var(--ink-dim);
    font-variant-numeric:tabular-nums;
    flex-shrink:0;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

  <div id="login-overlay">
    <button id="login-btn">Mit Spotify verbinden</button>
    <div id="login-hint">Einmalig nötig. Danach öffnet sich das Tool jedes Mal direkt in der Suche.</div>
  </div>

  <div id="app">
    <div id="phrase"></div>
    <div class="search-col">
      <input id="search-input" type="text" autocomplete="off" spellcheck="false" placeholder="" />
      <ul id="results-list"></ul>
    </div>
  </div>

  <button id="settings-btn" title="Einstellungen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>

  <div id="settings-panel" class="hidden">
    <h2>Einstellungen</h2>

    <div class="settings-row">
      <p id="account-name">–</p>
      <button id="logout-btn" class="settings-btn-row">Abmelden / Konto wechseln</button>
    </div>

    <div class="settings-row">
      <label class="settings-label" for="device-select">Wiedergabegerät</label>
      <select id="device-select">
        <option value="">Automatisch (aktuelles Gerät)</option>
      </select>
    </div>

    <div class="settings-row">
      <label class="settings-label" for="volume-slider">Lautstärke</label>
      <input id="volume-slider" type="range" min="0" max="100" value="50" />
    </div>

    <div class="settings-row">
      <label class="settings-label" for="result-count">Anzahl Vorschläge</label>
      <input id="result-count" type="number" min="5" max="10" value="7" />
    </div>
  </div>

  <div id="device-picker" class="hidden">
    <div class="device-picker-title">Wo abspielen?</div>
    <div id="device-picker-list"></div>
  </div>

  <div id="now-playing" class="hidden">
    <img id="np-cover" src="" alt="" />
    <div id="np-info">
      <div id="np-title"></div>
      <div id="np-artist"></div>
    </div>
    <div id="np-time"><span id="np-current">0:00</span> / <span id="np-remaining">-0:00</span></div>
  </div>

<script>
(() => {
  "use strict";

  // ============================================================
  // KONFIGURATION – hier eintragen
  // ============================================================
  const CLIENT_ID = "86a8861f0fe441949d60c18b59be7862"; // aus dem Spotify Developer Dashboard
  // Redirect-URI wird automatisch aus der aktuellen Seiten-URL gebildet.
  // Trage GENAU diesen Wert (so wie die Seite später gehostet ist, ohne
  // Anhängsel) im Spotify Dashboard unter "Redirect URIs" ein.
  const REDIRECT_URI = window.location.origin + window.location.pathname;
  const SCOPES = "user-read-playback-state user-modify-playback-state user-read-currently-playing";

  // Breite von Suchfeld & Ergebnisliste in px. Die exakte physische Größe
  // auf deinem Monitor hängt von dessen Pixeldichte/Zoom ab – am
  // zuverlässigsten stellst du das ein, indem du dein Handy neben den
  // Bildschirm hältst und diesen Wert (und/oder die Browser-Zoomstufe)
  // anpasst, bis es passt.
  const RESULTS_WIDTH_PX = 820;
  document.documentElement.style.setProperty("--results-width", RESULTS_WIDTH_PX + "px");

  // Sätze über dem Suchfeld
  const PHRASES_NOTHING_PLAYING = [
    "Es kann losgehen.",
    "Bereit für den ersten Song?",
    "Fang mit was Gutem an.",
    "Was hörst du als Erstes?",
    "Leg los, wenn du willst.",
    "Ein Song wartet auf dich.",
    "Zeit für Musik.",
    "Worauf hast du Lust?",
    "Stille war gestern.",
    "Mach den Anfang."
  ];
  const PHRASES_ALREADY_PLAYING = [
    "Was willst du hören?",
    "Was soll stattdessen laufen?",
    "Wonach steht dir der Sinn?",
    "Was darf's diesmal sein?",
    "Was kommt als Nächstes?",
    "Worauf hast du jetzt Lust?",
    "Was läuft gleich bei dir?",
    "Wechsel den Song.",
    "Was soll jetzt laufen?",
    "Such dir was Neues."
  ];

  // ============================================================
  // Elemente
  // ============================================================
  const el = {
    loginOverlay: document.getElementById("login-overlay"),
    loginBtn: document.getElementById("login-btn"),
    app: document.getElementById("app"),
    phrase: document.getElementById("phrase"),
    input: document.getElementById("search-input"),
    results: document.getElementById("results-list"),
    settingsBtn: document.getElementById("settings-btn"),
    settingsPanel: document.getElementById("settings-panel"),
    accountName: document.getElementById("account-name"),
    logoutBtn: document.getElementById("logout-btn"),
    deviceSelect: document.getElementById("device-select"),
    volumeSlider: document.getElementById("volume-slider"),
    resultCountInput: document.getElementById("result-count"),
    devicePicker: document.getElementById("device-picker"),
    devicePickerList: document.getElementById("device-picker-list"),
    nowPlaying: document.getElementById("now-playing"),
    npCover: document.getElementById("np-cover"),
    npTitle: document.getElementById("np-title"),
    npArtist: document.getElementById("np-artist"),
    npCurrent: document.getElementById("np-current"),
    npRemaining: document.getElementById("np-remaining"),
  };

  // ============================================================
  // Settings (localStorage)
  // ============================================================
  const settings = Object.assign({
    pinnedDevice: "",
    resultCount: 7,
    volume: 50
  }, JSON.parse(localStorage.getItem("sp_settings") || "{}"));

  function saveSettings(){
    localStorage.setItem("sp_settings", JSON.stringify(settings));
  }

  el.resultCountInput.value = settings.resultCount;
  el.volumeSlider.value = settings.volume;

  // ============================================================
  // PKCE Hilfsfunktionen
  // ============================================================
  function randomString(len){
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    let out = "";
    const arr = new Uint8Array(len);
    crypto.getRandomValues(arr);
    for (let i = 0; i < len; i++) out += chars[arr[i] % chars.length];
    return out;
  }

  function base64url(buffer){
    return btoa(String.fromCharCode(...new Uint8Array(buffer)))
      .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  async function sha256(str){
    const data = new TextEncoder().encode(str);
    return await crypto.subtle.digest("SHA-256", data);
  }

  async function startLogin(){
    const verifier = randomString(64);
    const challenge = base64url(await sha256(verifier));
    const state = randomString(16);
    sessionStorage.setItem("sp_verifier", verifier);
    sessionStorage.setItem("sp_state", state);

    const params = new URLSearchParams({
      client_id: CLIENT_ID,
      response_type: "code",
      redirect_uri: REDIRECT_URI,
      code_challenge_method: "S256",
      code_challenge: challenge,
      scope: SCOPES,
      state: state
    });
    window.location.href = "https://accounts.spotify.com/authorize?" + params.toString();
  }

  async function exchangeCodeForToken(code){
    const verifier = sessionStorage.getItem("sp_verifier");
    const body = new URLSearchParams({
      grant_type: "authorization_code",
      code: code,
      redirect_uri: REDIRECT_URI,
      client_id: CLIENT_ID,
      code_verifier: verifier
    });
    const res = await fetch("https://accounts.spotify.com/api/token", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body
    });
    if (!res.ok) throw new Error("Token-Austausch fehlgeschlagen");
    return res.json();
  }

  async function refreshAccessToken(){
    const refreshToken = localStorage.getItem("sp_refresh_token");
    if (!refreshToken) return null;
    const body = new URLSearchParams({
      grant_type: "refresh_token",
      refresh_token: refreshToken,
      client_id: CLIENT_ID
    });
    const res = await fetch("https://accounts.spotify.com/api/token", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body
    });
    if (!res.ok) return null;
    const data = await res.json();
    storeTokens(data);
    return data.access_token;
  }

  function storeTokens(data){
    if (data.access_token){
      localStorage.setItem("sp_access_token", data.access_token);
      localStorage.setItem("sp_expires_at", String(Date.now() + (data.expires_in * 1000) - 5000));
    }
    if (data.refresh_token){
      localStorage.setItem("sp_refresh_token", data.refresh_token);
    }
  }

  async function getValidAccessToken(){
    const expiresAt = Number(localStorage.getItem("sp_expires_at") || 0);
    const token = localStorage.getItem("sp_access_token");
    if (token && Date.now() < expiresAt) return token;
    return await refreshAccessToken();
  }

  function logout(){
    localStorage.removeItem("sp_access_token");
    localStorage.removeItem("sp_refresh_token");
    localStorage.removeItem("sp_expires_at");
    window.location.href = REDIRECT_URI;
  }

  // ============================================================
  // API Wrapper (mit Auto-Refresh bei 401)
  // ============================================================
  async function spotifyFetch(url, options = {}){
    let token = await getValidAccessToken();
    if (!token) { showLogin(); throw new Error("Nicht angemeldet"); }
    options.headers = Object.assign({}, options.headers, { Authorization: "Bearer " + token });
    let res = await fetch(url, options);
    if (res.status === 401){
      token = await refreshAccessToken();
      if (!token) { showLogin(); throw new Error("Nicht angemeldet"); }
      options.headers.Authorization = "Bearer " + token;
      res = await fetch(url, options);
    }
    return res;
  }

  function showLogin(){
    el.loginOverlay.classList.remove("hidden");
    el.app.classList.remove("ready");
  }

  // ============================================================
  // Suche & Tastatur-Navigation
  // ============================================================
  let currentResults = [];
  let selectedIndex = -1;
  let searchDebounce = null;

  el.input.addEventListener("input", () => {
    clearTimeout(searchDebounce);
    const q = el.input.value.trim();
    if (!q){ renderResults([]); return; }
    searchDebounce = setTimeout(() => runSearch(q), 300);
  });

  async function runSearch(q){
    const limit = Math.min(10, Math.max(5, Number(settings.resultCount) || 7));
    const res = await spotifyFetch(
      "https://api.spotify.com/v1/search?" + new URLSearchParams({ q, type: "track", limit })
    );
    if (!res.ok) return;
    const data = await res.json();
    renderResults((data.tracks && data.tracks.items) || []);
  }

  function renderResults(items){
    currentResults = items;
    selectedIndex = -1;
    el.results.innerHTML = "";
    items.forEach((track, i) => {
      const li = document.createElement("li");
      li.className = "result-item";
      li.dataset.index = i;
      const cover = (track.album && track.album.images && track.album.images[track.album.images.length - 1]) || {};
      li.innerHTML =
        '<img src="' + (cover.url || "") + '" alt="" />' +
        '<div class="result-text">' +
          '<div class="result-title"></div>' +
          '<div class="result-artist"></div>' +
        '</div>';
      li.querySelector(".result-title").textContent = track.name;
      li.querySelector(".result-artist").textContent = (track.artists || []).map(a => a.name).join(", ");
      li.addEventListener("click", () => playTrack(track));
      li.addEventListener("mouseenter", () => setSelected(i));
      el.results.appendChild(li);
    });
  }

  function setSelected(i){
    selectedIndex = i;
    [...el.results.children].forEach((li, idx) => {
      li.classList.toggle("active", idx === i);
    });
  }

  el.input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown"){
      e.preventDefault();
      if (currentResults.length === 0) return;
      setSelected(Math.min(selectedIndex + 1, currentResults.length - 1));
    } else if (e.key === "ArrowUp"){
      e.preventDefault();
      if (currentResults.length === 0) return;
      setSelected(Math.max(selectedIndex - 1, 0));
    } else if (e.key === "Enter"){
      e.preventDefault();
      if (currentResults.length === 0) return;
      const idx = selectedIndex >= 0 ? selectedIndex : 0; // ohne Auswahl: relevantestes Ergebnis
      playTrack(currentResults[idx]);
    } else if (e.key === "Escape"){
      el.input.value = "";
      renderResults([]);
    }
  });

  // ============================================================
  // Wiedergabe
  // ============================================================
  async function playTrack(track){
    // Wichtig: Wird nur "uris": [track] ohne Album-Kontext übergeben, legt
    // Spotify eine Warteschlange mit genau einem Song an - danach ist
    // Schluss, egal ob Autoplay in der Spotify-App an ist. Mit
    // context_uri (Album) + offset spielt Spotify normal weiter (Rest des
    // Albums, danach greift ggf. Spotifys eigenes Autoplay).
    const deviceId = settings.pinnedDevice || null;
    const url = "https://api.spotify.com/v1/me/player/play" + (deviceId ? "?device_id=" + deviceId : "");
    const res = await spotifyFetch(url, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ context_uri: track.album.uri, offset: { uri: track.uri } })
    });

    if (res.status === 404 || res.status === 403){
      // Kein aktives Gerät -> minimale Geräteauswahl anzeigen
      await showDevicePicker(track);
      return;
    }

    resetSearch();
    pollNowPlaying(true);
  }

  function resetSearch(){
    el.input.value = "";
    renderResults([]);
    el.input.focus();
  }

  async function showDevicePicker(track){
    const res = await spotifyFetch("https://api.spotify.com/v1/me/player/devices");
    if (!res.ok) return;
    const data = await res.json();
    el.devicePickerList.innerHTML = "";
    (data.devices || []).forEach(dev => {
      const row = document.createElement("div");
      row.className = "device-option";
      row.textContent = dev.name;
      row.addEventListener("click", async () => {
        await spotifyFetch("https://api.spotify.com/v1/me/player/play?device_id=" + dev.id, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ context_uri: track.album.uri, offset: { uri: track.uri } })
        });
        resetSearch();
        fadeOutDevicePicker();
        pollNowPlaying(true);
      });
      el.devicePickerList.appendChild(row);
    });
    el.devicePicker.classList.remove("hidden", "fading");
  }

  function fadeOutDevicePicker(){
    el.devicePicker.classList.add("fading");
    setTimeout(() => el.devicePicker.classList.add("hidden"), 1000);
  }

  // ============================================================
  // Now Playing
  // ============================================================
  let pollTimer = null;
  let tickTimer = null;
  let localProgressMs = 0;
  let localDurationMs = 0;
  let localTicking = false;

  function formatTime(ms){
    if (ms < 0) ms = 0;
    const totalSec = Math.floor(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return m + ":" + String(s).padStart(2, "0");
  }

  async function fetchPlaybackState(){
    const res = await spotifyFetch("https://api.spotify.com/v1/me/player");
    if (res.status === 204) return null;
    if (!res.ok) return null;
    return res.json();
  }

  function updateNowPlayingUI(state){
    if (!state || !state.item){
      el.nowPlaying.classList.add("hidden");
      localTicking = false;
      return;
    }
    if (el.devicePicker && !el.devicePicker.classList.contains("hidden") && state.is_playing){
      fadeOutDevicePicker();
    }
    const track = state.item;
    const cover = (track.album && track.album.images && track.album.images[track.album.images.length - 1]) || {};
    el.npCover.src = cover.url || "";
    el.npTitle.textContent = track.name;
    el.npArtist.textContent = (track.artists || []).map(a => a.name).join(", ");
    localProgressMs = state.progress_ms || 0;
    localDurationMs = track.duration_ms || 0;
    localTicking = !!state.is_playing;
    renderTime();
    el.nowPlaying.classList.remove("hidden");
  }

  function renderTime(){
    el.npCurrent.textContent = formatTime(localProgressMs);
    el.npRemaining.textContent = "-" + formatTime(localDurationMs - localProgressMs);
  }

  function pollNowPlaying(immediate){
    clearInterval(pollTimer);
    clearInterval(tickTimer);
    const tick = async () => {
      const state = await fetchPlaybackState();
      updateNowPlayingUI(state);
    };
    if (immediate) tick();
    pollTimer = setInterval(tick, 4000);
    tickTimer = setInterval(() => {
      if (!localTicking) return;
      localProgressMs = Math.min(localProgressMs + 1000, localDurationMs);
      renderTime();
    }, 1000);
  }

  // ============================================================
  // Einstellungen UI
  // ============================================================
  el.settingsBtn.addEventListener("click", () => {
    el.settingsPanel.classList.toggle("hidden");
  });
  document.addEventListener("click", (e) => {
    if (!el.settingsPanel.contains(e.target) && e.target !== el.settingsBtn && !el.settingsPanel.classList.contains("hidden")){
      if (!el.settingsBtn.contains(e.target)) el.settingsPanel.classList.add("hidden");
    }
  });

  el.logoutBtn.addEventListener("click", logout);

  el.deviceSelect.addEventListener("change", () => {
    settings.pinnedDevice = el.deviceSelect.value;
    saveSettings();
  });

  el.volumeSlider.addEventListener("change", async () => {
    settings.volume = Number(el.volumeSlider.value);
    saveSettings();
    const deviceId = settings.pinnedDevice || null;
    const url = "https://api.spotify.com/v1/me/player/volume?" +
      new URLSearchParams(Object.assign({ volume_percent: settings.volume }, deviceId ? { device_id: deviceId } : {}));
    await spotifyFetch(url, { method: "PUT" });
  });

  el.resultCountInput.addEventListener("change", () => {
    settings.resultCount = Math.min(10, Math.max(5, Number(el.resultCountInput.value) || 7));
    el.resultCountInput.value = settings.resultCount;
    saveSettings();
  });

  async function populateDeviceSelect(){
    const res = await spotifyFetch("https://api.spotify.com/v1/me/player/devices");
    if (!res.ok) return;
    const data = await res.json();
    el.deviceSelect.innerHTML = '<option value="">Automatisch (aktuelles Gerät)</option>';
    (data.devices || []).forEach(dev => {
      const opt = document.createElement("option");
      opt.value = dev.id;
      opt.textContent = dev.name;
      if (dev.id === settings.pinnedDevice) opt.selected = true;
      el.deviceSelect.appendChild(opt);
    });
  }

  async function loadAccountName(){
    const res = await spotifyFetch("https://api.spotify.com/v1/me");
    if (!res.ok) return;
    const data = await res.json();
    el.accountName.textContent = "Angemeldet als " + (data.display_name || data.id);
  }

  // ============================================================
  // Start
  // ============================================================
  el.loginBtn.addEventListener("click", startLogin);

  async function init(){
    const url = new URL(window.location.href);
    const code = url.searchParams.get("code");
    const state = url.searchParams.get("state");

    if (code){
      const savedState = sessionStorage.getItem("sp_state");
      window.history.replaceState({}, document.title, REDIRECT_URI);
      if (state !== savedState){
        showLogin();
        return;
      }
      try {
        const data = await exchangeCodeForToken(code);
        storeTokens(data);
      } catch (e){
        showLogin();
        return;
      }
    }

    const token = await getValidAccessToken();
    if (!token){
      showLogin();
      return;
    }

    el.loginOverlay.classList.add("hidden");

    // Ausgangszustand ermitteln -> passenden Satz wählen
    const state0 = await fetchPlaybackState();
    const phrases = (state0 && state0.is_playing) ? PHRASES_ALREADY_PLAYING : PHRASES_NOTHING_PLAYING;
    el.phrase.textContent = phrases[Math.floor(Math.random() * phrases.length)];
    updateNowPlayingUI(state0);
    if (state0 && state0.is_playing) pollNowPlaying(false);

    el.app.classList.add("ready");
    el.input.focus();

    loadAccountName();
    populateDeviceSelect();
  }

  init();
})();
</script>
</body>
</html>
