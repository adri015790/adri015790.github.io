<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Song</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#3c382f;
    --panel:#3B3C36;
    --panel-soft:#46463f;
    --ink:#EDE6D4;
    --ink-dim:#a99f8c;
    --accent:#cf9b3e;
    --danger:#c0725a;
    --radius-soft: 14px;

    /* Hintergrund: Cover geblurrt + abgedunkelt */
    --song-bg-blur: 60px;
    --song-bg-brightness: 0.5;

    /* Scharfe Cover-Karte in der Mitte */
    --cover-card-size: 240px;

    /* Steuerungs-Box unten */
    --control-btn-size: 28px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope', system-ui, sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  #bg{ position:fixed; inset:0; overflow:hidden; z-index:-1; background:var(--bg); }
  #bg-img{
    position:absolute; inset:-10%;
    background-size:cover; background-position:center;
    filter: blur(var(--song-bg-blur)) brightness(var(--song-bg-brightness));
  }

  #not-logged-in{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:24px;
  }
  #not-logged-in.hidden{display:none;}
  #not-logged-in a{ color:var(--accent); }

  #page{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh;
    padding:24px;
  }
  #page.hidden{display:none;}

  #cover-card{
    width:var(--cover-card-size);
    height:var(--cover-card-size);
    border-radius:var(--radius-soft);
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
    margin-bottom:22px;
    background:var(--panel-soft);
  }
  #cover-card img{ width:100%; height:100%; object-fit:cover; display:block; }

  #title{ font-size:1.7rem; font-weight:700; text-align:center; max-width:80vw; }
  #artist{ font-size:1.05rem; color:var(--ink-dim); text-align:center; margin-top:6px; max-width:80vw; }
  #album{ font-size:.82rem; color:var(--ink-dim); opacity:.75; text-align:center; margin-top:2px; max-width:80vw; }

  #settings-btn{
    position:fixed; top:16px; right:16px;
    width:22px; height:22px;
    border:none; background:transparent;
    color:var(--panel-soft); opacity:.55; cursor:pointer; padding:0; z-index:40;
    transition:opacity .15s ease, color .15s ease;
  }
  #settings-btn:hover{ opacity:1; color:var(--ink-dim); }
  #settings-btn svg{ width:100%; height:100%; }

  #settings-panel{
    position:fixed; top:46px; right:16px; width:260px;
    background:var(--panel); border:1px solid #4c4c44; border-radius:var(--radius-soft);
    padding:16px; z-index:41; box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  #settings-panel.hidden{display:none;}
  #settings-panel h2{ font-size:.8rem; font-weight:700; margin:0 0 12px; color:var(--ink-dim); }
  .settings-row{ margin-bottom:14px; }
  .settings-row:last-child{ margin-bottom:0; }
  .settings-label{ display:block; font-size:.78rem; color:var(--ink-dim); margin-bottom:5px; }
  .settings-row select, .settings-row input[type=range]{
    width:100%; font-family:inherit; background:var(--panel-soft); color:var(--ink);
    border:1px solid #55554c; border-radius:8px; padding:6px 8px; font-size:.85rem;
  }
  #account-name{ font-size:.88rem; font-weight:600; margin:0 0 8px; }
  #logout-btn{
    width:100%; font-family:inherit; font-size:.82rem; font-weight:600;
    background:transparent; color:var(--danger); border:1px solid var(--danger);
    border-radius:8px; padding:7px 0; cursor:pointer;
  }
  #logout-btn:hover{ background:rgba(192,114,90,.12); }

  /* Kapsel-Steuerungsbox wie in der Skizze gezeichnet */
  #control-box{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:8px;
    z-index:30;
  }
  #control-box.hidden{display:none;}

  #control-buttons{
    display:flex; align-items:center; justify-content:center; gap:22px;
    background:var(--panel); border:1.5px solid #4c4c44;
    border-radius:6px; /* Abgerundete Kapsel-Form */
    padding:8px 24px;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
  }
  .ctrl-btn{
    width:var(--control-btn-size); height:var(--control-btn-size);
    border:none; background:transparent; color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;
    transition:transform 0.15s ease, color 0.15s ease;
  }
  .ctrl-btn:hover{ color:var(--accent); transform:scale(1.1); }
  .ctrl-btn svg{ width:65%; height:65%; }
  #playpause-btn svg{ width:60%; height:60%; }

  #control-time{
    font-size:.78rem; color:var(--ink-dim); font-variant-numeric:tabular-nums;
    letter-spacing:0.5px; margin-top:2px; text-align:center;
  }

  /* Warteschlange ohne Scrollbalken, max. 9 Elemente */
  #queue-overlay{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    width:340px; max-width:88vw;
    background:var(--panel); border:1px solid #4c4c44; border-radius:var(--radius-soft);
    padding:16px; z-index:45; box-shadow:0 12px 32px rgba(0,0,0,.5);
    overflow:hidden; /* Kein Scrollbalken */
  }
  #queue-overlay.hidden{display:none;}
  #queue-title{ font-size:.78rem; font-weight:700; color:var(--ink-dim); margin-bottom:12px; text-transform:uppercase; letter-spacing:0.5px; }
  #queue-list{ list-style:none; margin:0; padding:0; }
  .queue-item{
    padding:8px 10px; font-size:.85rem; border-bottom:1px solid rgba(255,255,255,.05);
    border-radius:8px; cursor:pointer; transition:background .15s ease, transform .1s ease;
  }
  .queue-item:last-child{ border-bottom:none; }
  .queue-item:hover{
    background:rgba(255,255,255,.08);
  }
  /* Design für den Navigation-Button */
.nav-btn {
  position: fixed; 
  top: 16px; 
  right: 48px; /* Sitzt genau links neben dem Zahnrad */
  width: 22px; 
  height: 22px;
  color: var(--panel-soft); 
  opacity: .55; 
  cursor: pointer; 
  z-index: 40;
  transition: opacity .15s ease, color .15s ease;
}
.nav-btn:hover { 
  opacity: 1; 
  color: var(--ink-dim); 
}
  .queue-item-title{ font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .queue-artist{ color:var(--ink-dim); font-size:.74rem; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>

  <div id="bg"><div id="bg-img"></div></div>

  <div id="not-logged-in" class="hidden">
    <div>Noch nicht angemeldet.</div>
    <div>Bitte einmal auf der <a href="../">Such-Seite</a> anmelden, dann funktioniert diese Seite automatisch mit.</div>
  </div>

  <div id="page" class="hidden">
    <!-- Die Klasse morph-cover-target wurde hier direkt hinzugefügt -->
    <div id="cover-card" class="morph-cover-target"><img id="cover-img" src="" alt="" /></div>
    <div id="title"></div>
    <div id="artist"></div>
    <div id="album"></div>
  </div>
  <button id="settings-btn" title="Einstellungen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>
<a href="../" class="nav-btn" title="Zur Suche">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="8"></circle>
    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
  </svg>
</a>
  <div id="settings-panel" class="hidden">
    <h2>Einstellungen</h2>
    <div class="settings-row">
      <p id="account-name">–</p>
      <button id="logout-btn">Abmelden / Konto wechseln</button>
    </div>
    <div class="settings-row">
      <label class="settings-label" for="device-select">Wiedergabegerät</label>
      <select id="device-select">
        <option value="">Automatisch (aktuelles Gerät)</option>
      </select>
    </div>
    <div class="settings-row">
      <label class="settings-label" for="volume-slider">Lautstärke</label>
      <input id="volume-slider" type="range" min="0" max="100" value="50" />
    </div>
  </div>

<!-- Die Klasse morph-box-target wandert in den Haupt-Container -->
  <div id="control-box" class="hidden morph-box-target">
    <div id="control-buttons">
      <button id="prev-btn" class="ctrl-btn" title="Zurück">
        <svg viewBox="0 0 20 20" fill="currentColor"><rect x="3" y="3" width="2" height="14"/><polygon points="17,3 17,17 7,10"/></svg>
      </button>
      <button id="playpause-btn" class="ctrl-btn" title="Play/Pause">
        <svg id="play-icon" viewBox="0 0 20 20" fill="currentColor"><polygon points="4,3 18,10 4,17"/></svg>
        <svg id="pause-icon" viewBox="0 0 20 20" fill="currentColor" style="display:none;"><rect x="4" y="3" width="4" height="14"/><rect x="12" y="3" width="4" height="14"/></svg>
      </button>
      <button id="next-btn" class="ctrl-btn" title="Weiter">
        <svg viewBox="0 0 20 20" fill="currentColor"><rect x="15" y="3" width="2" height="14"/><polygon points="3,3 3,17 13,10"/></svg>
      </button>
    </div>
    <div id="control-time">0:00 / -0:00</div>
  </div>

  <div id="queue-overlay" class="hidden">
    <div id="queue-title">Nächste Songs (Warteschlange)</div>
    <ul id="queue-list"></ul>
  </div>

<script>
(() => {
  "use strict";

  const CLIENT_ID = "86a8861f0fe441949d60c18b59be7862";
  const VOLUME_STEP = 5;

  const el = {
    bgImg: document.getElementById("bg-img"),
    notLoggedIn: document.getElementById("not-logged-in"),
    page: document.getElementById("page"),
    coverImg: document.getElementById("cover-img"),
    title: document.getElementById("title"),
    artist: document.getElementById("artist"),
    album: document.getElementById("album"),
    controlBox: document.getElementById("control-box"),
    playPauseBtn: document.getElementById("playpause-btn"),
    playIcon: document.getElementById("play-icon"),
    pauseIcon: document.getElementById("pause-icon"),
    prevBtn: document.getElementById("prev-btn"),
    nextBtn: document.getElementById("next-btn"),
    timeEl: document.getElementById("control-time"),
    settingsBtn: document.getElementById("settings-btn"),
    settingsPanel: document.getElementById("settings-panel"),
    accountName: document.getElementById("account-name"),
    logoutBtn: document.getElementById("logout-btn"),
    deviceSelect: document.getElementById("device-select"),
    volumeSlider: document.getElementById("volume-slider"),
    queueOverlay: document.getElementById("queue-overlay"),
    queueList: document.getElementById("queue-list"),
  };

  const settings = Object.assign({ pinnedDevice: "", resultCount: 7, volume: 50 },
    JSON.parse(localStorage.getItem("sp_settings") || "{}"));
  function saveSettings(){ localStorage.setItem("sp_settings", JSON.stringify(settings)); }
  el.volumeSlider.value = settings.volume;

  async function refreshAccessToken(){
    const refreshToken = localStorage.getItem("sp_refresh_token");
    if (!refreshToken) return null;
    const body = new URLSearchParams({ grant_type: "refresh_token", refresh_token: refreshToken, client_id: CLIENT_ID });
    const res = await fetch("https://accounts.spotify.com/api/token", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body
    });
    if (!res.ok) return null;
    const data = await res.json();
    if (data.access_token){
      localStorage.setItem("sp_access_token", data.access_token);
      localStorage.setItem("sp_expires_at", String(Date.now() + data.expires_in * 1000 - 5000));
    }
    if (data.refresh_token) localStorage.setItem("sp_refresh_token", data.refresh_token);
    return data.access_token;
  }

  async function getValidAccessToken(){
    const expiresAt = Number(localStorage.getItem("sp_expires_at") || 0);
    const token = localStorage.getItem("sp_access_token");
    if (token && Date.now() < expiresAt) return token;
    return await refreshAccessToken();
  }

  async function spotifyFetch(url, options = {}){
    let token = await getValidAccessToken();
    if (!token) throw new Error("Nicht angemeldet");
    options.headers = Object.assign({}, options.headers, { Authorization: "Bearer " + token });
    let res = await fetch(url, options);
    if (res.status === 401){
      token = await refreshAccessToken();
      if (!token) throw new Error("Nicht angemeldet");
      options.headers.Authorization = "Bearer " + token;
      res = await fetch(url, options);
    }
    return res;
  }

  function logout(){
    localStorage.removeItem("sp_access_token");
    localStorage.removeItem("sp_refresh_token");
    localStorage.removeItem("sp_expires_at");
    window.location.href = "../";
  }

  let localProgressMs = 0, localDurationMs = 0, localTicking = false, isPlaying = false;
  let pollTimer = null, tickTimer = null, lastCoverUrl = "";

  function formatTime(ms){
    if (ms < 0) ms = 0;
    const totalSec = Math.floor(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return m + ":" + String(s).padStart(2, "0");
  }
  function renderTime(){
    el.timeEl.textContent = formatTime(localProgressMs) + " / -" + formatTime(localDurationMs - localProgressMs);
  }

  async function fetchPlaybackState(){
    const res = await spotifyFetch("https://api.spotify.com/v1/me/player");
    if (res.status === 204) return null;
    if (!res.ok) return null;
    return res.json();
  }

  function updatePlayPauseIcon(){
    el.playIcon.style.display = isPlaying ? "none" : "block";
    el.pauseIcon.style.display = isPlaying ? "block" : "none";
  }

  function updateNowPlayingUI(state){
    if (!state || !state.item) return;
    const track = state.item;
    const cover = (track.album && track.album.images && track.album.images[0]) || {};
    if (cover.url && cover.url !== lastCoverUrl){
      lastCoverUrl = cover.url;
      el.coverImg.src = cover.url;
      el.bgImg.style.backgroundImage = "url('" + cover.url + "')";
    }
    el.title.textContent = track.name;
    el.artist.textContent = (track.artists || []).map(a => a.name).join(", ");
    el.album.textContent = track.album ? track.album.name : "";
    document.title = track.name + " – " + (track.artists || []).map(a => a.name).join(", ");
    isPlaying = !!state.is_playing;
    updatePlayPauseIcon();
    localProgressMs = state.progress_ms || 0;
    localDurationMs = track.duration_ms || 0;
    localTicking = isPlaying;
    renderTime();
    if (state.device && typeof state.device.volume_percent === "number"){
      el.volumeSlider.value = state.device.volume_percent;
    }
  }

  function pollNowPlaying(){
    clearInterval(pollTimer);
    clearInterval(tickTimer);
    const tick = async () => { updateNowPlayingUI(await fetchPlaybackState()); };
    tick();
    pollTimer = setInterval(tick, 4000);
    tickTimer = setInterval(() => {
      if (!localTicking) return;
      localProgressMs = Math.min(localProgressMs + 1000, localDurationMs);
      renderTime();
    }, 1000);
  }

  function deviceQuery(){
    return settings.pinnedDevice ? "?device_id=" + settings.pinnedDevice : "";
  }

  async function togglePlayPause(){
    const url = "https://api.spotify.com/v1/me/player/" + (isPlaying ? "pause" : "play") + deviceQuery();
    await spotifyFetch(url, { method: "PUT" });
    isPlaying = !isPlaying;
    updatePlayPauseIcon();
    setTimeout(() => fetchPlaybackState().then(updateNowPlayingUI), 300);
  }

  async function skip(direction){
    const url = "https://api.spotify.com/v1/me/player/" + direction + deviceQuery();
    await spotifyFetch(url, { method: "POST" });
    setTimeout(() => fetchPlaybackState().then(updateNowPlayingUI), 400);
  }

  async function changeVolume(delta){
    const current = Number(el.volumeSlider.value) || 50;
    const next = Math.max(0, Math.min(100, current + delta));
    el.volumeSlider.value = next;
    settings.volume = next;
    saveSettings();
    const url = "https://api.spotify.com/v1/me/player/volume?" +
      new URLSearchParams(Object.assign({ volume_percent: next }, settings.pinnedDevice ? { device_id: settings.pinnedDevice } : {}));
    await spotifyFetch(url, { method: "PUT" });
  }

  el.playPauseBtn.addEventListener("click", togglePlayPause);
  el.prevBtn.addEventListener("click", () => skip("previous"));
  el.nextBtn.addEventListener("click", () => skip("next"));

  // Warteschlange: Zeigt genau 9 Songs, klickbar zum Abspielen
  async function showQueue(){
    const res = await spotifyFetch("https://api.spotify.com/v1/me/player/queue");
    if (!res.ok) return;
    const data = await res.json();
    el.queueList.innerHTML = "";
    
    // Genau maximal 9 Songs anzeigen
    (data.queue || []).slice(0, 9).forEach(t => {
      const li = document.createElement("li");
      li.className = "queue-item";

      const titleDiv = document.createElement("div");
      titleDiv.className = "queue-item-title";
      titleDiv.textContent = t.name;

      const artistDiv = document.createElement("div");
      artistDiv.className = "queue-artist";
      artistDiv.textContent = (t.artists || []).map(a => a.name).join(", ");

      li.appendChild(titleDiv);
      li.appendChild(artistDiv);

      // Klick auf Song spielt diesen direkt ab
      li.addEventListener("click", async () => {
        if (!t.uri) return;
        try {
          await spotifyFetch("https://api.spotify.com/v1/me/player/play" + deviceQuery(), {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ uris: [t.uri] })
          });
          setTimeout(() => fetchPlaybackState().then(updateNowPlayingUI), 400);
          hideQueue();
        } catch(e) {
          console.error("Fehler beim Abspielen aus Warteschlange", e);
        }
      });

      el.queueList.appendChild(li);
    });
    el.queueOverlay.classList.remove("hidden");
  }

  function hideQueue(){ el.queueOverlay.classList.add("hidden"); }

  document.addEventListener("keydown", (e) => {
    if (e.key === " "){ e.preventDefault(); togglePlayPause(); }
    else if (e.key === "ArrowLeft"){ e.preventDefault(); skip("previous"); }
    else if (e.key === "ArrowRight"){ e.preventDefault(); skip("next"); }
    else if (e.key === "ArrowUp"){ e.preventDefault(); changeVolume(VOLUME_STEP); }
    else if (e.key === "ArrowDown"){ e.preventDefault(); changeVolume(-VOLUME_STEP); }
    else if (e.key === "Control" && !e.repeat){ showQueue(); }
  });
  document.addEventListener("keyup", (e) => {
    if (e.key === "Control") hideQueue();
  });

  el.settingsBtn.addEventListener("click", () => el.settingsPanel.classList.toggle("hidden"));
  document.addEventListener("click", (e) => {
    if (!el.settingsPanel.contains(e.target) && !el.settingsBtn.contains(e.target)){
      el.settingsPanel.classList.add("hidden");
    }
  });
  el.logoutBtn.addEventListener("click", logout);
  el.deviceSelect.addEventListener("change", () => {
    settings.pinnedDevice = el.deviceSelect.value;
    saveSettings();
  });
  el.volumeSlider.addEventListener("change", async () => {
    settings.volume = Number(el.volumeSlider.value);
    saveSettings();
    const url = "https://api.spotify.com/v1/me/player/volume?" +
      new URLSearchParams(Object.assign({ volume_percent: settings.volume }, settings.pinnedDevice ? { device_id: settings.pinnedDevice } : {}));
    await spotifyFetch(url, { method: "PUT" });
  });

  async function populateDeviceSelect(){
    const res = await spotifyFetch("https://api.spotify.com/v1/me/player/devices");
    if (!res.ok) return;
    const data = await res.json();
    el.deviceSelect.innerHTML = '<option value="">Automatisch (aktuelles Gerät)</option>';
    (data.devices || []).forEach(dev => {
      const opt = document.createElement("option");
      opt.value = dev.id;
      opt.textContent = dev.name;
      if (dev.id === settings.pinnedDevice) opt.selected = true;
      el.deviceSelect.appendChild(opt);
    });
  }

  async function loadAccountName(){
    const res = await spotifyFetch("https://api.spotify.com/v1/me");
    if (!res.ok) return;
    const data = await res.json();
    el.accountName.textContent = "Angemeldet als " + (data.display_name || data.id);
  }

  async function init(){
    const token = await getValidAccessToken();
    if (!token){
      el.notLoggedIn.classList.remove("hidden");
      return;
    }
    el.page.classList.remove("hidden");
    el.controlBox.classList.remove("hidden");
    pollNowPlaying();
    loadAccountName();
    populateDeviceSelect();
  }

  init();
})();
</script>
</body>
</html>
